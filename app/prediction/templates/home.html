<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <title>画像判定アプリ</title>
</head>
<body>
  <div class="container py-5 text-center">
    <h2 class="mb-4">テニスラケットを画像判定します</h2>
    <form method="post" enctype="multipart/form-data">
      <div class="mb-3">
        {% csrf_token %}
        {{ form.as_p }}
        <input id="img_data" type="hidden" name="img_data" />
      </div>
      <img id="preview" style="display: none;" class="img-fluid mb-3 d-block mx-auto" />
      <br>
      <button type="submit" class="btn btn-primary btn-lg">判定</button>
    </form>
    {% if prediction %}
      <div id="prediction">
        <hr>
        <h2 class="mb-4">判定結果</h2>
        <p>あなたのアップロードした画像は「<strong>{{ prediction }}</strong>」でしょう。</p>
        <img src="{{ img_data }}" class="img-fluid mb-3">
      </div>
    {% endif %}
    <div class="mt-4">※現在判定に対応しているラケット一覧は<a href="/description">こちら</a></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const imageInput = document.getElementById('id_image');
      const preview = document.getElementById('preview');
      const imgData = document.getElementById('img_data');
      const prediction = document.getElementById('prediction');

      imageInput.addEventListener('change', () => {
        const file = imageInput.files[0];

        if (!file) return;

        const reader = new FileReader();

        reader.addEventListener('load', () => {
          preview.src = reader.result;
          preview.style.display = 'block';
          imgData.value = reader.result;
        });

        reader.readAsDataURL(file);

        if (prediction) {
          prediction.textContent = '';
        }
      });
    });
  </script>
</body>
</html>
